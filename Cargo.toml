[package]
name = "kursova_rust"
version = "0.1.0"
edition = "2024"
description = "Візуалізація роботи блокчейну: Rust-ядро + Chromium як GUI"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tiny_http = "0.12"

# Майнінг у debug-збірці теж має бути швидким.
[profile.dev]
opt-level = 2
